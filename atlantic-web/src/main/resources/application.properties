spring.application.name=AtlanticAPI
spring.datasource.url=jdbc:postgresql://localhost:5432/teste_tcc

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=9011

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# JWT: chave Base64 de pelo menos 32 bytes aleatórios, sem valor padrão.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:AtlanticAPI}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
